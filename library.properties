name=ArduinoWebsockets
version=0.5.5-memleak-fix
author=Gil Maimon <mail.gilmaimon@gmail.com>
maintainer=Gil Maimon <mail.gilmaimon@gmail.com>
sentence=A library for writing modern Websockets applications with Arduino.
paragraph=Featuring modern callbacks (supports lambdas) and a minimal interface. Contains a websockets Client and Server. Supports all features of the RFC (pings, pongs, binary and text data, error codes) and WSS (Websockets over SSL). This patched version fixes ESP32 setInsecure() fallback, Bad-file-number noise on failed SSL connect, and adds cleanup()/reset() to release the ~45 KB mbedtls context held by WiFiClientSecure.
category=Communication
url=https://github.com/gilmaimon/ArduinoWebsockets
includes=ArduinoWebsockets.h
